<style>
/*
VOICE   : outil de travail d'un coach, net et rapide, aucune décoration inutile.
IDEA    : l'agenda papier de poche : bandeau noir comme le logo INDAR, pages claires, heures en marge.
PICTURE : la semaine elle-même (liste par jour sur téléphone, grille horaire sur ordi), couleurs Google.
COLOUR  : noir INDAR pour le bandeau, papier blanc cassé, rouge INDAR pour l'action et « aujourd'hui ».
TYPE    : police système (rapide), chiffres tabulaires pour les heures.
LAYOUT  : téléphone : bandeau + bande des jours + liste + barre d'onglets ; ordi : rail à gauche, grille.
*/
:root {
  color-scheme: light dark;
  --bg: #f4f3ef; --card: #ffffff; --ink: #141413; --mut: #63625b; --line: #e3e2dc; --soft: #eeede8;
  --head: #111110; --head-ink: #ffffff; --acc: #d6202f; --acc-ink: #ffffff; --acc-soft: #fbe5e6;
  --ok: #1d7a4b; --warn: #a45a00; --warn-soft: #fff1dd; --r: 14px; --nav-h: 62px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 10px 30px rgba(0, 0, 0, .08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0f0f0e; --card: #1a1a18; --ink: #f2f1ec; --mut: #a3a29a; --line: #2c2c29; --soft: #232320;
    --head: #000000; --acc: #ef3b47; --acc-soft: #3a1a1c; --warn: #f0a640; --warn-soft: #33260f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .5);
  }
}
:root[data-theme=dark] {
    --bg: #0f0f0e; --card: #1a1a18; --ink: #f2f1ec; --mut: #a3a29a; --line: #2c2c29; --soft: #232320;
    --head: #000000; --acc: #ef3b47; --acc-soft: #3a1a1c; --warn: #f0a640; --warn-soft: #33260f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .5);
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); overflow-x: clip; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.mini { width: 14px; height: 14px; vertical-align: -2px; }
.mut { color: var(--mut); }
.small { font-size: 13px; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* --- barre de progression --- */
#busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .2s; background: linear-gradient(90deg, transparent, var(--acc), transparent); background-size: 40% 100%; background-repeat: no-repeat; }
#busy.on { opacity: 1; animation: busy 1.1s linear infinite; }
@keyframes busy { from { background-position: -40% 0; } to { background-position: 140% 0; } }

/* --- bandeau --- */
.hdr { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px 16px; background: var(--head); color: var(--head-ink); min-height: 56px; }
.hdr h1 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr h1.sub { font-size: 17px; }
.hdr h1 small { font-size: 14px; font-weight: 600; opacity: .6; }
.t-lg { display: none; }
.t-sm { display: inline; }
.hdr-l { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.hdr-l .who { font-size: 12px; opacity: .75; }
.hdr-r { display: flex; align-items: center; gap: 4px; flex: none; }
.hdr .ib { color: var(--head-ink); }
.hdr .ib:hover { background: rgba(255, 255, 255, .12); }
.hdr .tb { color: var(--head-ink); border-color: rgba(255, 255, 255, .3); }
.hdr .tb.solid { background: var(--acc); border-color: var(--acc); }
.hdr .seg { display: none; }
.hdr .back { display: inline-flex; align-items: center; gap: 4px; color: var(--head-ink); font-weight: 600; min-height: 44px; padding-right: 6px; }
.hdr .pill { background: rgba(255, 255, 255, .16); color: #fff; }
.seg { display: inline-flex; background: rgba(255, 255, 255, .12); border-radius: 10px; padding: 3px; margin-left: 4px; }
.seg button { padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, .8); min-height: 34px; }
.seg button.on { background: #fff; color: #111; }
.ib { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--ink); }
.ib:hover { background: var(--soft); }
.ib.sm { width: 36px; height: 36px; }
.ib.sm .ic { width: 19px; height: 19px; }
.ib.xs { width: 30px; height: 30px; margin-left: auto; color: var(--mut); }
.ib.xs .ic { width: 16px; height: 16px; }
.tb { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.tb .ic { width: 18px; height: 18px; }

/* --- bande des jours (téléphone) --- */
.strip { position: sticky; top: calc(env(safe-area-inset-top) + 56px); z-index: 15; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;
  padding: 6px 8px 8px; background: var(--head); color: #fff; }
.strip button { display: grid; justify-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 12px; color: rgba(255, 255, 255, .78); }
.strip .sd { font-size: 12px; font-weight: 600; }
.strip .sn { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.strip .dots { display: flex; gap: 2px; height: 6px; align-items: center; }
.strip .dots i { width: 5px; height: 5px; border-radius: 50%; }
.strip .dots b { font-size: 9px; line-height: 1; }
.strip button.tod .sn { color: #fff; background: var(--acc); }
.strip button.sel { background: rgba(255, 255, 255, .14); color: #fff; }
.strip button.off .sd { text-decoration: line-through; opacity: .7; }

/* --- contenu --- */
.main { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px); }
.pad { padding: 14px 14px 0; max-width: 820px; margin: 0 auto; }
.empty { padding: 40px 20px; text-align: center; color: var(--mut); }
.empty.big { padding: 80px 20px; font-size: 17px; }
.empty .btn { margin-top: 10px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; margin: 10px 0; }
.note .ic { width: 18px; height: 18px; margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.note.warn .ic { color: var(--warn); }
.note input { width: auto; display: inline-block; min-height: 32px; padding: 2px 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.link { text-decoration: none; font-size: 14px; padding: 6px 12px; }
.pill .ic { width: 15px; height: 15px; }
.sec { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 8px; font-size: 13px; text-transform: none; color: var(--mut); font-weight: 700; letter-spacing: .01em; }
.sec span { font-weight: 600; }
.link { color: var(--acc); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; }
.spin.dark { border-color: var(--line); border-top-color: var(--acc); }
@keyframes rot { to { transform: rotate(360deg); } }

/* --- semaine en liste (téléphone) --- */
.wl { padding: 8px 10px 0; }
.wl-day { background: var(--card); border-radius: var(--r); margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 140px; }
.wl-day header { display: flex; align-items: center; gap: 4px; padding: 4px 6px 0 6px; }
.wl-dt { flex: 1; text-align: left; padding: 8px 8px 6px; display: flex; align-items: baseline; gap: 6px; font-size: 16px; }
.wl-dt span { color: var(--mut); }
.wl-dt em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--acc-ink); background: var(--acc); padding: 2px 8px; border-radius: 999px; }
.wl-day.past { opacity: .62; }
.wl-day.tod { outline: 2px solid var(--acc); outline-offset: -2px; }
.wl-items { padding: 0 6px 8px; display: grid; gap: 2px; }
.wl-empty { padding: 0 16px 14px; color: var(--mut); font-size: 14px; }
.offband { margin: 0 10px 8px; padding: 6px 10px; border-radius: 10px; background: var(--warn-soft); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.offband .ic { width: 16px; height: 16px; color: var(--warn); }
.it { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 8px 8px 10px; border-radius: 10px; position: relative; min-height: 52px; }
.it::before { content: ""; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; background: var(--c); }
.it:hover { background: var(--soft); }
.it-t { display: grid; font-variant-numeric: tabular-nums; line-height: 1.15; padding-left: 4px; }
.it-t b { font-size: 15px; }
.it-t small { color: var(--mut); font-size: 12px; }
.it.ad .it-t { font-size: 12px; color: var(--mut); font-weight: 600; }
.it-b { display: grid; line-height: 1.25; }
.it-n { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-n .ic { margin-right: 4px; color: var(--mut); }
.it-s { color: var(--mut); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it.ro .it-n { font-weight: 500; }
.it.done { opacity: .55; }
.flag { color: var(--warn); }
.flag .ic { width: 18px; height: 18px; }
.task { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 10px; min-height: 44px; }
.task .ck { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--mut); display: grid; place-items: center; flex: none; }
.task .ck .ic { width: 16px; height: 16px; stroke-width: 3; }
.task.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.done .task-t { text-decoration: line-through; color: var(--mut); }
.task-t { font-size: 15px; }
.task-t small { color: var(--mut); font-size: 12px; margin-right: 4px; }

/* --- grille horaire --- */
.daybar { padding: 10px 12px 0; display: flex; justify-content: flex-end; }
.tl { margin: 8px 8px 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.tl-head, .tl-ad, .tl-body { display: grid; }
.tl-head { border-bottom: 1px solid var(--line); }
.tl-dh { display: grid; justify-items: center; padding: 6px 0; gap: 0; color: var(--mut); }
.tl-dh span { font-size: 12px; font-weight: 600; }
.tl-dh b { font-size: 19px; color: var(--ink); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.tl-dh.tod b { background: var(--acc); color: #fff; }
.tl-dh.off span { text-decoration: line-through; }
.tl.one .tl-head { display: none; }
.tl-ad { border-bottom: 1px solid var(--line); background: var(--soft); }
.tl-adc { padding: 4px 3px; display: grid; gap: 3px; align-content: start; border-left: 1px solid var(--line); }
.tl-adc .task { min-height: 34px; padding: 2px 4px; gap: 6px; }
.tl-adc .task .ck { width: 20px; height: 20px; }
.tl-adc .task-t { font-size: 13px; }
.tl-gut { position: relative; font-size: 11px; color: var(--mut); font-variant-numeric: tabular-nums; }
.tl-ad .tl-gut { padding: 6px 4px; text-align: right; }
.tl-body .tl-gut span { position: absolute; right: 6px; transform: translateY(-50%); }
.tl-scroll { overflow: visible; }
.tl-body { position: relative; background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hpx)); }
.tl-col { position: relative; border-left: 1px solid var(--line); cursor: copy; }
.tl-col.tod { background: color-mix(in srgb, var(--acc) 4%, transparent); }
.tl-col.off { background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--warn) 9%, transparent) 8px 16px); }
.tl-ev { position: absolute; text-align: left; overflow: hidden; border-radius: 7px; padding: 3px 6px 3px 7px; font-size: 12.5px; line-height: 1.2;
  background: var(--soft); background: color-mix(in srgb, var(--c) 20%, var(--card)); border-left: 3px solid var(--c); display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
.tl-ev:hover { background: color-mix(in srgb, var(--c) 30%, var(--card)); z-index: 2; }
.tl-ev.ro { background: color-mix(in srgb, var(--c) 11%, var(--card)); }
.tl-ev.done { opacity: .55; }
.tl-et { font-variant-numeric: tabular-nums; color: var(--mut); font-size: 11.5px; display: flex; gap: 3px; align-items: center; }
.tl-en { font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.tl-el { color: var(--mut); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-ev.short { flex-direction: row; gap: 5px; align-items: center; white-space: nowrap; }
.tl-ev.short .tl-en { white-space: nowrap; }
.tl.one .tl-ev { font-size: 14px; padding: 5px 8px 5px 9px; }
.tl.one .tl-et { font-size: 12.5px; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--acc); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
.chip.off { background: var(--warn-soft); color: var(--warn); font-size: 12px; padding: 3px 8px; min-height: 26px; justify-content: flex-start; }
.chip.off .ic { width: 14px; height: 14px; }
.tl-adc .chip { min-height: 26px; padding: 3px 8px; font-size: 12px; border-radius: 6px; background: color-mix(in srgb, var(--c) 22%, var(--card)); border-left: 3px solid var(--c); justify-content: flex-start; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; text-align: left; }

/* --- onglets --- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line); }
.nav button { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--mut); }
.nav button.on { color: var(--acc); }
.nav .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--acc); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.nav-foot { display: none; }
.fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); z-index: 31; width: 60px; height: 60px; border-radius: 20px;
  background: var(--acc); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(214, 32, 47, .35); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.fab:active { transform: scale(.96); }
body.share .main { padding-bottom: 40px; }

/* --- feuilles --- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); animation: fade .15s ease-out; }
.sheet { position: relative; width: 100%; max-width: 620px; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 6px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); animation: up .2s ease-out; }
.sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 6px; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg, #busy.on { animation: none; } }
body.sheet-open { overflow: hidden; }
.sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sh-head h2 { margin: 6px 0 2px; font-size: 21px; line-height: 1.2; }
.sh-head p { margin: 0; color: var(--mut); font-size: 14px; }
.sh-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; position: sticky; bottom: -16px; background: var(--card); padding: 10px 0 0; }
.sh-foot.sticky { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 12px 0; background: var(--bg); }
.ev-head { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 6px; }
.ev-head .bar { align-self: stretch; border-radius: 6px; background: var(--c); margin: 8px 0; }
.ev-head h2 { margin: 6px 0 4px; font-size: 21px; line-height: 1.2; overflow-wrap: anywhere; }
.ev-head p { margin: 0 0 2px; font-size: 15px; }
.ev-body { display: grid; gap: 8px; padding: 8px 0 4px 18px; }
.row { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.row .ic { width: 19px; height: 19px; color: var(--mut); margin-top: 1px; }
.row.notes { white-space: pre-wrap; color: var(--mut); padding-left: 29px; font-size: 14px; overflow-wrap: anywhere; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.actions .mut { grid-column: 1 / -1; margin: 4px 2px 0; }
.abtn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--soft); font-weight: 600; font-size: 14.5px; text-align: left; text-decoration: none; min-height: 50px; }
.abtn .ic { width: 20px; height: 20px; }
.abtn:hover { background: color-mix(in srgb, var(--ink) 8%, var(--soft)); }
.opts { display: grid; gap: 8px; margin-top: 6px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line); }
.opt:hover { border-color: var(--acc); background: var(--acc-soft); }
.opt .ic { width: 22px; height: 22px; color: var(--acc); margin-top: 1px; }
.opt b { display: block; font-size: 16px; }
.opt small { display: block; color: var(--mut); font-size: 13.5px; margin-top: 2px; }

/* --- formulaires --- */
.form { display: grid; gap: 12px; }
label { display: grid; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--mut); }
label.check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 500; font-size: 15px; min-height: 40px; }
label.check input { width: 20px; height: 20px; accent-color: var(--acc); }
label.mini-l { font-size: 12.5px; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--mut); margin: 2px 0 -4px; }
input, select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); font-size: 16px; color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox], input[type=radio] { min-height: 0; width: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15.5px; background: var(--soft); color: var(--ink); }
.btn.primary { background: var(--acc); color: var(--acc-ink); }
.btn.danger { background: #b3261e; color: #fff; }
.btn.ghost { background: transparent; color: var(--mut); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn .ic { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14.5px; font-weight: 600; white-space: nowrap; flex: none; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.accent { border-color: var(--acc); color: var(--acc); }
.chip.ghost { border-style: dashed; color: var(--mut); }
.chip.person i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip.day { min-width: 46px; }
.chip .ic { width: 16px; height: 16px; }
.types .chip { min-height: 36px; }
.qa { margin: 2px 0 12px; }
.qa-in { font-size: 17px; min-height: 52px; border: 2px solid var(--ink); border-radius: 14px; }
.qa-prev { margin-top: 8px; font-size: 14.5px; min-height: 22px; line-height: 1.5; }
.qa-prev .miss { color: var(--warn); }
.more-t { margin-top: 2px; font-size: 14px; }
.rep { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: var(--soft); }
.radios { border: 0; padding: 0; margin: 4px 0 0; display: grid; gap: 8px; }
.radios legend { font-size: 13.5px; font-weight: 600; color: var(--mut); margin-bottom: 6px; padding: 0; }
.radios label { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-weight: 400; }
.radios label:has(input:checked) { border-color: var(--acc); background: var(--acc-soft); }
.radios input { margin-top: 3px; accent-color: var(--acc); width: 18px; height: 18px; }
.radios b { display: block; font-size: 15px; }
.radios small { display: block; color: var(--mut); font-size: 13px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.sw.on { border-color: var(--card); box-shadow: 0 0 0 2px var(--ink); }
.sw.none { background: repeating-linear-gradient(45deg, var(--soft) 0 4px, var(--card) 4px 8px); }
.free { display: grid; gap: 8px; }
.fday { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fday span { width: 100%; font-size: 13px; font-weight: 700; color: var(--mut); }
.copybox { font-size: 14px; word-break: break-all; }
.rbox { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 10px; margin: 4px 0 0; }
.rbox legend { font-weight: 700; font-size: 14px; padding: 0 6px; }
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 6px; align-items: center; }

/* --- coachés --- */
.search { min-height: 46px; border-radius: 12px; }
.cards { display: grid; gap: 8px; }
.cc { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.dot.big { width: 18px; height: 18px; margin-top: 9px; }
.cc-b { display: grid; line-height: 1.3; }
.cc-b b { font-size: 16px; }
.cc-b span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-b .mut { font-size: 13px; }
.arch { margin-top: 18px; }
.arch summary { cursor: pointer; color: var(--mut); font-weight: 600; padding: 8px 2px; }
.cd-head { display: flex; gap: 12px; align-items: flex-start; }
.cd-head h2 { margin: 0; font-size: 24px; line-height: 1.2; }
.cd-head p { margin: 2px 0 0; }
.cd-contact { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.cd .notes { white-space: pre-wrap; color: var(--mut); font-size: 14px; }
.actions.row4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin-top: 14px; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.card h3 .ic { width: 18px; height: 18px; color: var(--mut); }
details.card > summary { list-style: none; cursor: pointer; }
details.card > summary::-webkit-details-marker { display: none; }
.rhythm { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
.rhythm:first-of-type { border-top: 0; }
.rhythm b { font-size: 16px; }
.pack { display: grid; gap: 4px; margin-top: 4px; font-size: 14px; }
.meter { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c, var(--acc)); border-radius: 8px; }
.mini-list { display: grid; }
.mini-list > .mini { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); font-size: 15px; text-align: left; width: 100%; }
.mini-list > .mini:first-child { border-top: 0; }
.pcard { padding: 12px 0; border-top: 1px solid var(--line); }
.pcard:first-of-type { border-top: 0; }
.pc-h { display: flex; gap: 10px; align-items: flex-start; }
.pc-h .dot { margin-top: 6px; }
.pc-h > div { display: grid; }
.pc-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-left: 22px; }
.warn-t { color: var(--warn); font-size: 13.5px; }

/* --- plus --- */
.menu { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.mi { display: grid; grid-template-columns: 24px minmax(0, 1fr) 20px; gap: 14px; align-items: center; width: 100%; padding: 14px 16px; text-align: left; border-top: 1px solid var(--line); text-decoration: none; }
.mi:first-child { border-top: 0; }
.mi b { display: block; font-size: 16px; }
.mi small { display: block; color: var(--mut); font-size: 13px; }
.mi .chev { width: 18px; height: 18px; color: var(--mut); }
.row-card { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--card); border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.row-card b { display: block; }
.row-card small { display: block; color: var(--mut); font-size: 13px; }
.addtask { display: grid; grid-template-columns: minmax(0, 1fr) 140px 52px; gap: 6px; }
.addtask .btn { padding: 0; }
.tasks { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px; }
.checks { display: grid; gap: 2px; }
.checks .dot { width: 10px; height: 10px; }
.trow { display: grid; grid-template-columns: 1.2fr 1.2fr .9fr 1fr auto; gap: 6px; align-items: center; margin-top: 8px; }
.trow label.check.tg { font-size: 13px; min-height: 32px; gap: 6px; white-space: nowrap; }
.trow label.check.tg input { width: 18px; height: 18px; }
label.check.gtog { flex-wrap: wrap; row-gap: 0; }
label.check.gtog small { flex-basis: 100%; padding-left: 37px; margin-top: -8px; font-weight: 400; font-size: 13px; }
.gdest { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 13.5px; color: var(--mut); }
.gdest .link { font-size: 13.5px; }
.ctable { display: grid; gap: 4px; }
.crow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 54px 54px 54px; gap: 6px; align-items: center; font-size: 14px; }
.crow.head { font-size: 12px; color: var(--mut); font-weight: 700; }
.crow > span { display: flex; gap: 6px; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow input[type=text], .crow input:not([type]) { min-height: 38px; padding: 6px 8px; font-size: 14px; }
.tog { display: grid; place-items: center; min-height: 38px; }
.tog input { width: 20px; height: 20px; accent-color: var(--acc); }
.hrow { display: grid; grid-template-columns: 130px 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 4px; }
.hrow input[type=time] { min-height: 38px; padding: 4px 8px; }
.help ul { padding-left: 20px; margin: 6px 0; }
.help li { margin: 5px 0; }
.help code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-size: 14px; }

/* --- toast --- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px); transform: translate(-50%, 20px); z-index: 70; max-width: min(92vw, 520px);
  background: #1d1d1b; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; font-weight: 500; opacity: 0; pointer-events: none; transition: .2s; box-shadow: var(--shadow); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #8e1c17; }

  .hrow { grid-template-columns: 110px 1fr auto 1fr; }

<script>
/* Saisie rapide en français : « Sonia mardi 18h », « rdv banque jeudi 14h30 1h »,
 * « tâche appeler le comptable demain », « Camille tous les mardis et jeudis 18h »,

  var DAY_FULL_RE = '(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)s?';

    { re: 'reunions?|meeting|visio', type: 'reunion', strip: false },
    { re: 'taches?|todo|a faire|rappel', type: 'tache', strip: true },
    { re: 'coaching|seances?|coach', type: 'coaching', strip: true },

  function parse(text, ctx) {
    ctx = ctx || {};
    var O = String(text || ''), N = normText(O), used = [];

    });
    var typeSpan = null;

    }

    var cands = [];
    (ctx.coachees || []).forEach(function (c) {
      if (!c.prenom) return;
      if (c.nom) cands.push({ c: c, txt: normText((c.prenom + ' ' + c.nom).toLowerCase()) });
      cands.push({ c: c, txt: normText(String(c.prenom).toLowerCase()) });
    });
    cands.sort(function (a, b) { return b.txt.length - a.txt.length; });

      (function (cd) {
        scan(escRe(cd.txt).replace(/\s+/g, '\\s+'), function (g, s, e) { res.coacheeId = cd.c.id; coachSpan = [s, e]; });
      })(cands[ci]);

      });
      if (!res.date) scan('(?:le\\s+)?' + NUM_DATE, function (g) { var ds = dateFromNum(g[1], g[2], g[3]); if (!ds) return false; res.date = ds; });

      '<p>Ouvre ton <b>lien de connexion</b> sur cet appareil (une seule fois), ou colle-le ici.</p>' +
      (msg ? '<p class="note warn">' + esc(msg) + '</p>' : '') +
      '<form id="conn-f"><input id="conn-in" placeholder="https://indarcoaching.github.io/planning/#c=…" autocomplete="off" aria-label="Lien de connexion"><button class="btn primary" type="submit">Se connecter</button></form>' +
      '<p class="mut small">Le lien contient ta clé : garde-le pour toi. Pour partager ton planning, crée plutôt un lien de partage depuis l\'appli.</p></div></main>';
    $('#conn-f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = $('#conn-in').value.trim(), m = /c=([A-Za-z0-9_\-]+)/.exec(v);
      if (!m) { renderConnect('Lien non reconnu.'); return; }
      try { var c = JSON.parse(unb64url(m[1])); if (!c.u || !c.k) throw new Error(); lsSet('mp_cfg', c); location.hash = ''; location.reload(); }
      catch (e) { renderConnect('Lien non reconnu.'); }
    });
  }
  function start() {
    if (!DEMO) {
      var fromHash = readCfgFromHash();
      if (fromHash) {
        lsSet('mp_cfg', fromHash);
        lsDel('mp_boot');
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
      }
      S.cfg = lsGet('mp_cfg');
      if (!S.cfg) { renderConnect(); return; }
    } else S.cfg = { u: 'demo', k: 'demo' };
    shell();
    S.wasWide = wide();
    var cached = !DEMO ? lsGet('mp_boot') : null;
    if (cached && cached.role === 'admin') {
      S.boot = cached; S.role = 'admin';
      var w = lsGet('mp_w_' + weekKey(S.date));
      if (w) { w.stale = true; S.weeks[w.from] = w; }
    }
    render();
    var mon = weekKey(S.date);
    call('boot', { from: mon, to: addDays(mon, 7) }).then(function (b) {
      var week = applyBoot(b);
      if (week) setWeek(week);
      S.lastFetch = Date.now();
      if (S.role === 'share') S.view = wide() ? 'week' : S.view;
      render();
      prefetch();
    }).catch(function (e) {
      if (!$('#main')) return;
      if (!S.boot) { $('#main').innerHTML = '<div class="empty big"><p>' + esc(e.message) + '</p><button class="btn primary" data-act="reload">Réessayer</button></div>'; }
      else toast(e.message + ' (données affichées : dernière lecture)', 'err');
    });
  }
  window.MPApp = { start: start, S: S };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
